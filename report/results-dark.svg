<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc"><title id="title">Storm: completion and billing are separate guarantees</title><desc id="desc">1000 runs per strategy. Nine bars on one shared count scale show lost runs, extra tool writes and double-billed runs. Each strategy also reports its completion rate. Zero is a baseline tick.</desc><rect width="900" height="420" fill="#181a1c"/><g fill="#f5f1e8" font-family="system-ui,sans-serif"><text x="24" y="34" font-size="24" font-weight="650">Retry restores completion. It can repeat billing.</text><text x="24" y="61" font-size="15" fill="#b9b5ad">storm · 1000 runs · 16 workers · seed 42 · crashes, duplicates, hangs, errors + drain</text><path d="M 355.00 100 V 366" stroke="#3d4144"/><text x="355.00" y="90" text-anchor="middle" font-size="13" fill="#b9b5ad">0</text><path d="M 511.67 100 V 366" stroke="#3d4144"/><text x="511.67" y="90" text-anchor="middle" font-size="13" fill="#b9b5ad">200</text><path d="M 668.33 100 V 366" stroke="#3d4144"/><text x="668.33" y="90" text-anchor="middle" font-size="13" fill="#b9b5ad">400</text><path d="M 825.00 100 V 366" stroke="#3d4144"/><text x="825.00" y="90" text-anchor="middle" font-size="13" fill="#b9b5ad">600</text><g aria-label="naive: 44.8% completed"><text x="24" y="126" font-size="19" font-weight="650" fill="#adadad">naive</text><text x="24" y="150" font-size="15" fill="#b9b5ad">44.8% complete</text><g aria-label="Lost runs: 552"><text x="337" y="119" text-anchor="end" font-size="15">Lost runs</text><rect x="355" y="106" width="432.40" height="17" rx="2" fill="#adadad"/><text x="780.40" y="119" text-anchor="end" font-size="15" font-weight="650" fill="#181a1c">552</text></g><g aria-label="Extra effects: 117"><text x="337" y="143" text-anchor="end" font-size="15">Extra effects</text><rect x="355" y="130" width="91.65" height="17" rx="2" fill="#adadad"/><text x="439.65" y="143" text-anchor="end" font-size="15" font-weight="650" fill="#181a1c">117</text></g><g aria-label="Double-billed: 8"><text x="337" y="167" text-anchor="end" font-size="15">Double-billed</text><rect x="355" y="154" width="6.27" height="17" rx="2" fill="#adadad"/><text x="371.27" y="167" text-anchor="start" font-size="15" font-weight="650" fill="#f5f1e8">8</text></g></g><path d="M 24 187 H 876" stroke="#3d4144"/><g aria-label="at-least-once: 100.0% completed"><text x="24" y="222" font-size="19" font-weight="650" fill="#e4e4e4">at-least-once</text><text x="24" y="246" font-size="15" fill="#b9b5ad">100.0% complete</text><g aria-label="Lost runs: 0"><text x="337" y="215" text-anchor="end" font-size="15">Lost runs</text><path d="M 355 202 v 16" stroke="#e4e4e4" stroke-width="2"/><text x="365.00" y="215" text-anchor="start" font-size="15" font-weight="650" fill="#f5f1e8">0</text></g><g aria-label="Extra effects: 284"><text x="337" y="239" text-anchor="end" font-size="15">Extra effects</text><rect x="355" y="226" width="222.47" height="17" rx="2" fill="#e4e4e4"/><text x="570.47" y="239" text-anchor="end" font-size="15" font-weight="650" fill="#181a1c">284</text></g><g aria-label="Double-billed: 49"><text x="337" y="263" text-anchor="end" font-size="15">Double-billed</text><rect x="355" y="250" width="38.38" height="17" rx="2" fill="#e4e4e4"/><text x="386.38" y="263" text-anchor="end" font-size="15" font-weight="650" fill="#181a1c">49</text></g></g><path d="M 24 283 H 876" stroke="#3d4144"/><g aria-label="exactly-once: 100.0% completed"><text x="24" y="318" font-size="19" font-weight="650" fill="#83c9f4">exactly-once</text><text x="24" y="342" font-size="15" fill="#b9b5ad">100.0% complete</text><g aria-label="Lost runs: 0"><text x="337" y="311" text-anchor="end" font-size="15">Lost runs</text><path d="M 355 298 v 16" stroke="#83c9f4" stroke-width="2"/><text x="365.00" y="311" text-anchor="start" font-size="15" font-weight="650" fill="#83c9f4">0</text></g><g aria-label="Extra effects: 0"><text x="337" y="335" text-anchor="end" font-size="15">Extra effects</text><path d="M 355 322 v 16" stroke="#83c9f4" stroke-width="2"/><text x="365.00" y="335" text-anchor="start" font-size="15" font-weight="650" fill="#83c9f4">0</text></g><g aria-label="Double-billed: 0"><text x="337" y="359" text-anchor="end" font-size="15">Double-billed</text><path d="M 355 346 v 16" stroke="#83c9f4" stroke-width="2"/><text x="365.00" y="359" text-anchor="start" font-size="15" font-weight="650" fill="#83c9f4">0</text></g></g><text x="24" y="399" font-size="13" fill="#b9b5ad">Lost / billed: runs. Extra effects: writes beyond the first. Shared scale; counts per 1000 runs.</text></g></svg>