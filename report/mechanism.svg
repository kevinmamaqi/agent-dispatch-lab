<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">The write succeeded. The acknowledgement did not.</title><desc id="desc">One tool step, three strategies. A worker crashes after writing an effect but before recording completion. Naive loses progress despite the existing effect. Retry redelivers and writes twice. Exactly-once grants a new version, rejects a stale duplicate claim, reuses the cached result, deduplicates the write and commits. This is an illustrative ten-second loop, with a static final frame for reduced motion.</desc><style>.still{display:none}@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style><rect width="900" height="560" fill="#faf9f6"/><g fill="#242424" font-family="system-ui,sans-serif"><defs><clipPath id="links"><rect x="314" y="120" width="66" height="48"/><rect x="486" y="120" width="54" height="48"/><rect x="646" y="120" width="70" height="48"/><rect x="314" y="252" width="66" height="48"/><rect x="486" y="252" width="54" height="48"/><rect x="646" y="252" width="70" height="48"/><rect x="314" y="384" width="66" height="48"/><rect x="486" y="384" width="54" height="48"/><rect x="646" y="384" width="70" height="48"/></clipPath></defs><text x="24" y="34" font-size="24" font-weight="650">The write succeeded. The acknowledgement didn’t.</text><text x="24" y="61" font-size="15" fill="#65635f">One tool step · crash after effect, before completion is logged · same key on redelivery</text><text x="271" y="99" text-anchor="middle" font-size="16" font-weight="600">Queue</text><text x="433" y="99" text-anchor="middle" font-size="16" font-weight="600">Worker</text><text x="593" y="99" text-anchor="middle" font-size="16" font-weight="600">Provider</text><text x="785" y="99" text-anchor="middle" font-size="16" font-weight="600">Ledger</text><text x="24" y="141" font-size="19" font-weight="650" fill="#242424">naive</text><text x="24" y="166" font-size="15" fill="#65635f">No recovery</text><rect x="228" y="120" width="86" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 314 144 H 374 m -5 -4 l 5 4 -5 4" fill="none" stroke="#dedbd4"/><rect x="380" y="120" width="106" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 486 144 H 534 m -5 -4 l 5 4 -5 4" fill="none" stroke="#dedbd4"/><rect x="540" y="120" width="106" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 646 144 H 710 m -5 -4 l 5 4 -5 4" fill="none" stroke="#dedbd4"/><rect x="716" y="120" width="138" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 24 222 H 876" stroke="#dedbd4"/><text x="24" y="273" font-size="19" font-weight="650" fill="#242424">at-least-once</text><text x="24" y="298" font-size="15" fill="#65635f">Retry, no key check</text><rect x="228" y="252" width="86" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 314 276 H 374 m -5 -4 l 5 4 -5 4" fill="none" stroke="#dedbd4"/><rect x="380" y="252" width="106" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 486 276 H 534 m -5 -4 l 5 4 -5 4" fill="none" stroke="#dedbd4"/><rect x="540" y="252" width="106" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 646 276 H 710 m -5 -4 l 5 4 -5 4" fill="none" stroke="#dedbd4"/><rect x="716" y="252" width="138" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 24 354 H 876" stroke="#dedbd4"/><text x="24" y="405" font-size="19" font-weight="650" fill="#166294">exactly-once</text><text x="24" y="430" font-size="15" fill="#65635f">Key + version + log</text><rect x="228" y="384" width="86" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 314 408 H 374 m -5 -4 l 5 4 -5 4" fill="none" stroke="#dedbd4"/><rect x="380" y="384" width="106" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 486 408 H 534 m -5 -4 l 5 4 -5 4" fill="none" stroke="#dedbd4"/><rect x="540" y="384" width="106" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><path d="M 646 408 H 710 m -5 -4 l 5 4 -5 4" fill="none" stroke="#dedbd4"/><rect x="716" y="384" width="138" height="48" rx="8" fill="#faf9f6" stroke="#dedbd4"/><g class="motion"><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.23;0.43;0.72;1" values="1;0;0;0;0"/><text x="271" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">step</text><text x="433" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">running</text><text x="593" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">call 1</text><text x="785" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">0 writes</text><text x="228" y="198" font-size="15" fill="#242424">Dispatch the tool step; wait for the result.</text><text x="271" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">step</text><text x="433" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">running</text><text x="593" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">call 1</text><text x="785" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">0 writes</text><text x="228" y="330" font-size="15" fill="#242424">Dispatch the tool step; wait for the result.</text><text x="271" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">step</text><text x="433" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">running</text><text x="593" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">call 1</text><text x="785" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">0 writes</text><text x="228" y="462" font-size="15" fill="#166294">Dispatch the tool step; wait for the result.</text><text x="24" y="519" font-size="18" font-weight="600">1 / 4  Dispatch one step</text><g clip-path="url(#links)"><circle r="5" fill="#242424"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.22;0.23;1" keyPoints="0;1;1;1" path="M 271 144 H 785"/></circle></g><g clip-path="url(#links)"><circle r="5" fill="#242424"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.22;0.23;1" keyPoints="0;1;1;1" path="M 271 276 H 785"/></circle></g><g clip-path="url(#links)"><circle r="5" fill="#166294"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.22;0.23;1" keyPoints="0;1;1;1" path="M 271 408 H 785"/></circle></g></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.23;0.43;0.72;1" values="0;1;0;0;0"/><text x="271" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">no ack</text><text x="433" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">crashed</text><text x="593" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">cached</text><text x="785" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">1 write</text><text x="228" y="198" font-size="15" fill="#242424">Effect exists; completion has not been recorded.</text><text x="271" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">no ack</text><text x="433" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">crashed</text><text x="593" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">cached</text><text x="785" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">1 write</text><text x="228" y="330" font-size="15" fill="#242424">Effect exists; completion has not been recorded.</text><text x="271" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">no ack</text><text x="433" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">crashed</text><text x="593" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">cached</text><text x="785" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">1 write</text><text x="228" y="462" font-size="15" fill="#166294">Effect exists; the step log still says provider_called.</text><text x="24" y="519" font-size="18" font-weight="600">2 / 4  Crash in the ambiguous window</text></g><g opacity="0"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.23;0.43;0.72;1" values="0;0;1;0;0"/><text x="271" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">empty</text><text x="433" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">dead</text><text x="593" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">1 call</text><text x="785" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">1 write</text><text x="228" y="198" font-size="15" fill="#242424">No redelivery: the run loses progress; the first row remains.</text><text x="271" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">retry</text><text x="433" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">running</text><text x="593" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">call 2</text><text x="785" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">1 write</text><text x="228" y="330" font-size="15" fill="#242424">Redelivery repeats the provider call and the unkeyed write.</text><text x="271" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">v1 + v0</text><text x="433" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">v1 wins</text><text x="593" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">cache hit</text><text x="785" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">1 write</text><text x="228" y="462" font-size="15" fill="#166294">v0 is fenced; the v1 owner recovers the cached result.</text><text x="24" y="519" font-size="18" font-weight="600">3 / 4  Redeliver, then replay or recover</text><g clip-path="url(#links)"><circle r="5" fill="#242424"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.43;0.68;1" keyPoints="0;0;1;1" path="M 271 276 H 785"/></circle></g><g clip-path="url(#links)"><circle r="5" fill="#166294"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.43;0.68;1" keyPoints="0;0;1;1" path="M 271 408 H 785"/></circle></g><circle r="5" fill="#faf9f6" stroke="#166294" stroke-width="2"><animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.48;0.56;1" keyPoints="0;0;1;1" path="M 271 376 H 433"/></circle></g><g opacity="1"><animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.23;0.43;0.72;1" values="0;0;0;1;1"/><text x="271" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">empty</text><text x="433" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">dead</text><text x="593" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">1 call</text><text x="785" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">1 write</text><text x="228" y="198" font-size="15" fill="#242424">No redelivery: the run loses progress; the first row remains.</text><text x="271" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">acked</text><text x="433" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">done</text><text x="593" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">2 calls</text><text x="785" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">2 writes</text><text x="228" y="330" font-size="15" fill="#242424">Progress restored. The same tool effect happened twice.</text><text x="271" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">acked</text><text x="433" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">committed</text><text x="593" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">1 call</text><text x="785" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">1 write</text><text x="228" y="462" font-size="15" fill="#166294">Keyed write deduplicated → commit. Billing waits for all steps.</text><text x="24" y="519" font-size="18" font-weight="600">4 / 4  Lost progress / duplicate effect / one committed effect</text></g></g><g class="still"><text x="271" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">empty</text><text x="433" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">dead</text><text x="593" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">1 call</text><text x="785" y="150" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">1 write</text><text x="228" y="198" font-size="15" fill="#242424">No redelivery: the run loses progress; the first row remains.</text><text x="271" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">acked</text><text x="433" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">done</text><text x="593" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">2 calls</text><text x="785" y="282" text-anchor="middle" font-size="16" font-weight="600" fill="#242424">2 writes</text><text x="228" y="330" font-size="15" fill="#242424">Progress restored. The same tool effect happened twice.</text><text x="271" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">acked</text><text x="433" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">committed</text><text x="593" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">1 call</text><text x="785" y="414" text-anchor="middle" font-size="16" font-weight="600" fill="#166294">1 write</text><text x="228" y="462" font-size="15" fill="#166294">Keyed write deduplicated → commit. Billing waits for all steps.</text><text x="24" y="519" font-size="18" font-weight="600">4 / 4  Lost progress / duplicate effect / one committed effect</text></g><text x="24" y="546" font-size="13" fill="#65635f">Illustration of one crash window. A cache miss can still require another physical provider call.</text></g></svg>